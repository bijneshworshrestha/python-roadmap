<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Learning Roadmap</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>🐍 Python Learning Roadmap</h1>
      <p class="subtitle">A stage-by-stage path from fundamentals to deployment. Check off topics as you go — your progress is saved in this browser.</p>
      <div class="progress-summary">
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="overall-fill"></div>
        </div>
        <span id="overall-label">0 / 0 topics complete</span>
      </div>
      <button id="reset-btn" class="reset-btn">Reset progress</button>
    </div>
  </header>

  <main id="stages-container" class="stages-container">
    <!-- Stages are rendered here by app.js -->
  </main>

  <footer class="site-footer">
    <p>Built as a static site — content is a general-purpose learning outline, not tied to any single course.</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
